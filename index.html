<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>JMM Bell Commander</title>
<meta name="description" content="Schedule and ring madrasa bells from multiple timetables." />

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0F5C45" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Bell Commander" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/favicon-64.png" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ============================== LOGIN GATE ============================== -->
  <div id="login-screen">
    <div class="login-card">
      <img src="icons/icon-192.png" alt="" class="login-icon" />
      <div class="login-title">JMM Bell Commander</div>
      <div class="login-sub">Enter the shared madrasa password to open the bell station on this device.</div>
      <div id="login-form">
        <input type="password" id="login-password" class="input" placeholder="Password" autocomplete="current-password" autofocus />
        <button type="button" id="login-submit-btn" class="btn btn--gold btn--block">Enter</button>
        <div class="login-error" id="login-error"></div>
      </div>
    </div>
  </div>

  <!-- ============================== APP SHELL ============================== -->
  <div id="app-shell" class="hidden">

    <main>
      <section id="screen-now" class="screen is-active"></section>
      <section id="screen-timetables" class="screen"></section>
      <section id="screen-rings" class="screen"></section>
      <section id="screen-settings" class="screen"></section>
    </main>

    <nav class="tabbar">
      <button class="tabbar__btn is-active" data-tab="now"><span class="tabbar__icon">🕰</span>Now</button>
      <button class="tabbar__btn" data-tab="timetables"><span class="tabbar__icon">📅</span>Timetables</button>
      <button class="tabbar__btn" data-tab="rings"><span class="tabbar__icon">🔔</span>Rings</button>
      <button class="tabbar__btn" data-tab="settings"><span class="tabbar__icon">⚙️</span>Settings</button>
    </nav>
  </div>

  <!-- ============================== MODAL ============================== -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-root" class="modal"></div>
  </div>

  <!-- ============================== TOASTS ============================== -->
  <div id="toast-host"></div>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/scheduler.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
